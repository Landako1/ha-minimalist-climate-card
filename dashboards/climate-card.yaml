# ----------------------------------------------------------------------------------
# Minimalist Climate Stack Card for Home Assistant
# ----------------------------------------------------------------------------------
# A clean, modern card combining Temperature and Humidity in one seamless graph.
#
# Requirements (Install via HACS):
# 1. custom:stack-in-card
# 2. custom:mini-graph-card
# 3. custom:card-mod
# ----------------------------------------------------------------------------------

type: custom:stack-in-card
cards:
  - type: custom:mini-graph-card
    entities:
      # --- Temperature Sensor ---
      - entity: sensor.YOUR_TEMPERATURE_SENSOR
        name: Temperature
        show_state: true
        color_thresholds:
          - value: 0
            color: "#52ADF2" # Blue for cold
          - value: 22
            color: "#f4b400" # Optional: Add more thresholds for heat
      
      # --- Humidity Sensor ---
      - entity: sensor.YOUR_HUMIDITY_SENSOR
        name: Humidity
        show_state: true
        y_axis: secondary
        color_thresholds:
          - value: 0
            color: "#76E233" # Healthy (Green)
          - value: 55
            color: "#f4b400" # Warning (Yellow)
          - value: 60
            color: "#ff4444" # High Risk/Mold (Red)

    # --- Graph Settings ---
    height: 70
    line_width: 3
    hours_to_show: 24
    smoothing: true
    animate: true
    color_thresholds_mode: each
    
    # --- UI Elements ---
    show:
      fill: fade
      icon: false
      name: true
      state: true
      legend: false
      
    # --- Styling (Removes borders and padding) ---
    card_mod:
      style: |
        ha-card {
          margin-bottom: 0px !important;
          padding-bottom: 0px !important;
          border: none !important;
          box-shadow: none !important;
        }
